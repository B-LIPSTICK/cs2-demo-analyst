<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:"
    />
    <title>Voice Panel</title>
  </head>
  <body>
    <div class="vp-root">
      <!-- 仅语音：说话者 + 转写字幕；不显示地图/比分/回合 -->
      <div class="vp-close" id="closeBtn" title="Close">✕</div>

      <!-- 说话者（当前谁在说话） -->
      <div class="vp-speakers" id="speakers"></div>

      <!-- 转写字幕（大字号，最近几条） -->
      <div class="vp-captions" id="captions"></div>
    </div>
    <script type="module" src="/full-src/main.ts"></script>
  </body>
</html>
