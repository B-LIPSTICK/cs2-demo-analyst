<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:"
    />
    <title>Voice Panel</title>
  </head>
  <body>
    <div class="vp-root">
      <!-- 顶部：地图 / 比分 / 回合（小而不抢眼） -->
      <div class="vp-top">
        <span class="vp-map" id="map">—</span>
        <span class="vp-score"><b class="t" id="scT">0</b>:<b class="ct" id="scCT">0</b></span>
        <span class="vp-round" id="round"></span>
        <span class="vp-close" id="closeBtn">✕</span>
      </div>

      <!-- 说话者（当前谁在说话） -->
      <div class="vp-speakers" id="speakers"></div>

      <!-- 转写字幕（大字号，最近几条） -->
      <div class="vp-captions" id="captions"></div>
    </div>
    <script type="module" src="/full-src/main.ts"></script>
  </body>
</html>
