appId: com.demoanalyst.cs2
productName: CS2 Demo Analyst
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - build/icon-256.png
extraResources:
  # 游戏内语音 HUD 产物：
  #  - 静态 VPK：显式 inject fallback
  #  - addon/：非侵入式 addon HUD（编译后的 .vxml_c/.vcss_c/.vjs_c）
  - from: assets/panorama
    to: panorama
    filter:
      - "*.vpk"
      - "addon/**/*"
asar: true
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CS2 Demo Analyst
  artifactName: CS2-Demo-Analyst-${version}-setup.${ext}
npmRebuild: false
electronDownload:
  cache: true
# 离线打包：直接用 npm 安装的本地 Electron dist（跳过 electron-builder 的 GitHub 下载）
electronDist: node_modules/electron/dist
# 只打包中/英语言包，减 ~40MB
electronLanguages:
  - en-US
  - zh-CN
