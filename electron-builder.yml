appId: com.demoanalyst.cs2
productName: CS2 Demo Analyst
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - build/icon-256.png
asar: true
win:
  icon: build/icon.ico
  target:
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-portable-${arch}.${ext}
portable:
  artifactName: ${productName}-${version}-portable-${arch}.${ext}
npmRebuild: false
electronDownload:
  cache: true
# 离线打包：直接用 npm 安装的本地 Electron dist（跳过 electron-builder 的 GitHub 下载）
electronDist: node_modules/electron/dist
# 只打包中/英语言包，减 ~40MB
electronLanguages:
  - en-US
  - zh-CN
